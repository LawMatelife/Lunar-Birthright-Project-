<text x="600" y="1532" text-anchor="middle" fill="#765f35" font-family="Arial,sans-serif" font-size="11">FOUNDING SAMPLE • CUSTOMER NAME, BIRTH MOON, REGION, COORDINATES, ID AND ISSUE DATE ARE PERSONALISED</text>
