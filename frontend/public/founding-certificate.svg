<circle cx="600" cy="1575" r="350" fill="url(#moon)" stroke="#d5ac4a" stroke-width="2"/>
<path d="M250 1434 Q600 1240 950 1434" fill="none" stroke="#f1d47f" stroke-width="3" opacity=".75" filter="url(#glow)"/>
