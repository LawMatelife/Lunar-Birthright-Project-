name: Create Isolated Lunar Vercel Preview

on:
  push:
    branches: ["v4-recovery-admin-hardening"]
    paths:
      - ".github/workflows/create-isolated-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_TEAM_ID: team_SnpCi1c3nwHCVvUXpv0AeLwl
  VERCEL_TEAM_SLUG: lawmatelifes-projects
  VERCEL_PROJECT_NAME: lunar-birthright-v4-isolated

jobs:
  create-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Verify Vercel token is available without exposing it
        id: token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "LUNAR_ISOLATED_VERCEL_BLOCKED_NO_TOKEN"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "LUNAR_ISOLATED_VERCEL_TOKEN_PRESENT"
          fi

      - name: Create project idempotently
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")
          if [ "$status" = "200" ]; then
            echo "LUNAR_ISOLATED_VERCEL_PROJECT_EXISTS"
          elif [ "$status" = "404" ]; then
            create_status=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.vercel.com/v11/projects?teamId=$VERCEL_TEAM_ID" \
              --data "{\"name\":\"$VERCEL_PROJECT_NAME\",\"framework\":null,\"buildCommand\":\"npm run build:ci\",\"outputDirectory\":\"frontend/build\"}")
            test "$create_status" = "200" || test "$create_status" = "201" || { cat /tmp/project.json; exit 1; }
            echo "LUNAR_ISOLATED_VERCEL_PROJECT_CREATED"
          else
            cat /tmp/project.json
            exit 1
          fi
          python - <<'PY'
          import json
          p=json.load(open('/tmp/project.json'))
          print('LUNAR_ISOLATED_VERCEL_PROJECT_ID', p.get('id','unknown'))
          print('LUNAR_ISOLATED_VERCEL_PROJECT_NAME', p.get('name','unknown'))
          PY

      - name: Install Vercel CLI
        if: steps.token.outputs.available == 'true'
        run: npm install --global vercel@latest

      - name: Link only this checkout to the isolated project
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --yes \
            --project "$VERCEL_PROJECT_NAME" \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN"
          python - <<'PY'
          import json
          p=json.load(open('.vercel/project.json'))
          print('LUNAR_ISOLATED_LINK_ORG', p.get('orgId','unknown'))
          print('LUNAR_ISOLATED_LINK_PROJECT', p.get('projectId','unknown'))
          PY

      - name: Deploy preview only
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --token "$VERCEL_TOKEN")
          echo "LUNAR_ISOLATED_PREVIEW_URL=$url"
          echo "### Isolated Lunar preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only. No custom domain or production promotion performed." >> "$GITHUB_STEP_SUMMARY"
