name: Lunar Backend Route Inspect

on:
  push:
    branches: ["v4-recovery-admin-hardening"]
    paths:
      - "backend_bundle/**"
      - "scripts/inspect_backend_routes.py"
      - "scripts/inspect_backend_functions.py"
      - "scripts/inspect_backend_env.py"
      - ".github/workflows/backend-route-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode bundle and print route map only
        run: python scripts/inspect_backend_routes.py
      - name: Print backend environment variable names only
        run: python scripts/inspect_backend_env.py
      - name: Print selected route functions for integration review
        run: python scripts/inspect_backend_functions.py
      - name: Print allocation and payment helper functions for safe checkout integration
        run: >-
          python scripts/inspect_backend_functions.py
          allocate_plot_to_user
          _mark_stripe_payment_paid
          process_certificate_and_nft
          _build_checkout_metadata
      - name: Print authentication and notification helpers for admin integration
        run: >-
          python scripts/inspect_backend_functions.py
          login
          get_me
          create_admin_notification
          get_current_user
      - name: Print certificate delivery helpers before mint decoupling
        run: >-
          python scripts/inspect_backend_functions.py
          _build_certificate_urls
          send_purchase_confirmation_email
          get_my_certificate
          get_certificate_status
          download_certificate_pdf
          _build_nft_db_update
          mint_nft_for_certificate
      - name: Print email and PDF helpers before paid fulfillment patch
        run: >-
          python scripts/inspect_backend_functions.py
          send_email_async
          generate_premium_certificate_pdf
          get_purchase_confirmation_email_html
      - name: Print public registry functions before audited override
        run: >-
          python scripts/inspect_backend_functions.py
          get_registry_counter
          get_country_statistics
          get_country_leaderboard
          get_recent_citizens
          get_viral_stats
