name: Lunar Frontend Flow Inspect

on:
  push:
    branches: ["v4-recovery-admin-hardening"]
    paths:
      - "buildgate/**"
      - "scripts/inspect_frontend_source.py"
      - ".github/workflows/frontend-flow-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect gift registration login and checkout flow source
        run: python scripts/inspect_frontend_source.py
