name: Lunar Birthright CI

on:
  push:
    branches: ["main", "v4-production-candidate", "v4-recovery-admin-hardening"]
  pull_request:
    branches: ["main", "v4-production-candidate"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Tracked-secret backup and diagnostic hygiene gate
        run: python scripts/security_gate.py

      - name: Verify Python runtime recovery helpers and entrypoints
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile \
            api/index.py \
            api/diag.py \
            api/runtime_hardening.py \
            api/public_registry_hardening.py \
            api/admin_profile_tools.py \
            backend/birth_moon.py \
            scripts/security_gate.py \
            scripts/audit_export.py \
            scripts/restore_export_to_atlas.py \
            scripts/reconcile_atlas.py \
            scripts/reconcile_browser_claims.py \
            scripts/inspect_backend_routes.py \
            scripts/inspect_backend_functions.py \
            scripts/inspect_backend_env.py \
            scripts/migrate_v4_legacy.py \
            tests/test_v4_logic.py
          python - <<'PY'
          import json
          import motor, pymongo, fastapi
          print("motor", motor.version)
          print("pymongo", pymongo.version)
          print("fastapi", fastapi.__version__)
          assert tuple(map(int, motor.version.split('.')[:2])) >= (3, 6)
          config = json.load(open('vercel.json', encoding='utf-8'))
          assert config['env']['ENABLE_POLYGON_MINT'] == 'false'
          assert config['env']['MINTING_RELEASE_GATE'] == 'closed'
          assert not any(r.get('destination') == '/api/admin.py' for r in config.get('rewrites', []))
          assert 'api/admin.py' not in config.get('functions', {})
          env_example = open('.env.example', encoding='utf-8').read()
          for required in ('JWT_SECRET_KEY=', 'STRIPE_API_KEY=', 'STRIPE_WEBHOOK_SECRET=', 'MONGO_URL=', 'RESEND_API_KEY='):
              assert required in env_example, required
          assert '\nJWT_SECRET=' not in env_example
          assert '\nSTRIPE_SECRET_KEY=' not in env_example
          print('VERCEL_RELEASE_GATES_OK')
          PY

      - name: Verify non-destructive audit registry and mint gates statically
        run: |
          grep -q 'record_preserved' api/runtime_hardening.py
          grep -q 'registry_exclusions' api/runtime_hardening.py
          grep -q 'admin_actions' api/runtime_hardening.py
          grep -q 'ENABLE_POLYGON_MINT' api/runtime_hardening.py
          grep -q 'MINTING_RELEASE_GATE' api/runtime_hardening.py
          grep -q 'registry_exclusions' api/public_registry_hardening.py
          grep -q '/api/registry/counter' api/public_registry_hardening.py
          grep -q '/api/registry/recent-citizens' api/public_registry_hardening.py
          grep -q '/api/registry/countries' api/public_registry_hardening.py
          grep -q '/api/registry/leaderboard' api/public_registry_hardening.py
          grep -q '/api/registry/viral-stats' api/public_registry_hardening.py
          grep -q '/api/admin/profile-update' api/admin_profile_tools.py
          grep -q '/api/admin/duplicate-check' api/admin_profile_tools.py
          grep -q '/api/admin/registry-classify' api/admin_profile_tools.py
          grep -q 'name_match_not_used' api/admin_profile_tools.py
          grep -q 'Founding Citizen 000001 is protected from exclusion' api/admin_profile_tools.py
          ! grep -Eq 'delete_one|delete_many|find_one_and_delete' api/runtime_hardening.py api/public_registry_hardening.py api/admin_profile_tools.py
          test ! -e api/admin.py
          echo "NON_DESTRUCTIVE_REGISTRY_AND_MINT_GATE_OK"

      - name: Inspect checked-in backend route map without executing backend
        run: python scripts/inspect_backend_routes.py

      - name: Run deterministic V4 logic tests
        run: python -m unittest discover -s tests -v

      - name: Build exact V4 frontend candidate without touching Atlas
        env:
          CI: "true"
        run: npm run build:ci

      - name: Verify production UI certificate and admin contract
        run: |
          test -f frontend/build/index.html
          test -s frontend/build/index.html
          test -s frontend/build/founding-certificate.svg
          grep -q "LUNAR BIRTHRIGHT" frontend/build/founding-certificate.svg
          grep -q "BIRTH DATE" frontend/build/founding-certificate.svg
          grep -q "SYMBOLIC PLOT COORDINATES" frontend/build/founding-certificate.svg
          grep -q "Their Birthday. Their Birth Moon. Their Place on the Moon." frontend/build/index.html
          grep -q "Create a personalised symbolic Lunar Birthright gift for only NZ\$12." frontend/build/index.html
          grep -q "Claim Mine Free" frontend/build/index.html
          grep -q "Create a Personalised Gift — NZ\$12" frontend/build/index.html
          grep -q "Symbolic commemorative registry only—no legal ownership of lunar land is conveyed." frontend/build/index.html
          grep -q "LBP_REGISTRY_STATS_LIVE_V1" frontend/build/index.html
          grep -q "LBP_ADMIN_REGISTRY_AUDIT_V1" frontend/build/index.html
          grep -q "LBP_ADMIN_PROFILE_TOOLS_V1" frontend/build/index.html
          grep -q "/api/admin/registry-decision" frontend/build/index.html
          grep -q "/api/admin/registry-audit" frontend/build/index.html
          grep -q "/api/admin/profile-update" frontend/build/index.html
          grep -q "/api/admin/duplicate-check" frontend/build/index.html
          grep -q "/api/admin/registry-classify" frontend/build/index.html
          ! grep -Eqi 'href=["'"'"'][^"'"'"']*STRIPE_SETUP\.md' frontend/build/index.html
          ! grep -qi "NFT TOKEN \[TOKEN ID\]" frontend/build/founding-certificate.svg
          ! grep -qi "DIGITAL ARCHIVE KEY / NFT TOKEN ID" frontend/build/founding-certificate.svg
          echo "V4 production recovery admin, profile tools and certificate contract verified"
