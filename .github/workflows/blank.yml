name: Lunar Birthright CI

on:
  push:
    branches: ["main", "v4-production-candidate"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Tracked-secret and backup hygiene gate
        run: python scripts/security_gate.py

      - name: Verify Python runtime and entrypoints
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile \
            api/index.py \
            api/diag.py \
            backend/birth_moon.py \
            scripts/security_gate.py \
            scripts/reconcile_atlas.py
          python - <<'PY'
          import motor, pymongo, fastapi
          print("motor", motor.version)
          print("pymongo", pymongo.version)
          print("fastapi", fastapi.__version__)
          assert tuple(map(int, motor.version.split('.')[:2])) >= (3, 6)
          PY

      - name: Build exact V4 frontend candidate
        env:
          CI: "true"
        run: npm run build

      - name: Verify production build output
        run: |
          test -f frontend/build/index.html
          test -s frontend/build/index.html
          echo "V4 CI build verified"
